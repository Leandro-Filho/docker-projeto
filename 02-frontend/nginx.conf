# ============================================================
# nginx para SPA + proxy reverso para a API
# Montar em /etc/nginx/conf.d/default.conf
# ============================================================

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compressão (deixa o carregamento bem mais rápido)
    gzip              on;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length   256;

    # ------------------------------------------------------------
    # 1. PROXY REVERSO PARA A API
    #    "api" é o NOME DO SERVIÇO no docker-compose.
    #    O nginx roda DENTRO do Docker, então ele resolve esse nome.
    #    O navegador chama /api/... (relativo) -> mesma origem -> SEM CORS.
    #    Precisa vir ANTES do "location /".
    # ------------------------------------------------------------
    location /api/ {
        proxy_pass         http://api:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Para WebSocket, se houver
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ------------------------------------------------------------
    # 2. ASSETS com hash no nome: cache longo
    # ------------------------------------------------------------
    location ~* \.(js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # ------------------------------------------------------------
    # 3. index.html NUNCA em cache
    #    Senão o usuário fica preso numa versão antiga do app
    # ------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ------------------------------------------------------------
    # 4. ROTAS DO SPA
    #    try_files: tenta o arquivo, tenta a pasta, e por fim entrega
    #    o index.html para o JavaScript assumir o roteamento.
    #    SEM ISTO, apertar F5 em /tarefas dá 404.
    # ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Saúde do próprio nginx (para healthcheck)
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Não expor a versão do nginx nos headers
    server_tokens off;
}
