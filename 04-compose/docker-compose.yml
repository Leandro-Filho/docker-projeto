# ============================================================
# PRODUÇÃO — front (nginx) + api (gunicorn) + banco (postgres)
#
# Subir:   docker compose up -d --build
# Validar: docker compose config
# ============================================================

services:

  # ----------------------------------------------------------
  # FRONTEND — nginx servindo os estáticos + proxy reverso
  # É o ÚNICO serviço com porta publicada.
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${PORTA_FRONT:-3000}:80"      # HOST:CONTAINER
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - appnet

  # ----------------------------------------------------------
  # BACKEND — gunicorn. Sem porta publicada: o nginx alcança
  # por dentro da rede, pelo nome "api".
  # ----------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # host "db" = nome do serviço, resolvido pelo DNS interno
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SECRET_KEY: ${SECRET_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy     # espera o banco estar PRONTO
    restart: unless-stopped
    networks:
      - appnet
    # Se quiser testar a API direto (Postman), descomente:
    # ports:
    #   - "${PORTA_API:-8000}:8000"

  # ----------------------------------------------------------
  # BANCO — imagem oficial, volume, healthcheck, sem porta
  # ----------------------------------------------------------
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - dadospg:/var/lib/postgresql/data
      # init.sql só roda quando o volume está VAZIO
      - ./banco/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - appnet

volumes:
  dadospg:

networks:
  appnet:
    driver: bridge
